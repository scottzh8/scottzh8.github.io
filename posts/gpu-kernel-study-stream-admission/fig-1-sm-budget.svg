<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SM budget: 148 SMs, B holds 96 at first, then 4 or 5 stragglers; A needs 144 free SMs at once">
  <!-- scale: 4.4 px per SM, bar starts at x=120; 148 SMs -> 651 px -->
  <text x="120" y="22" class="t-muted t-mono" font-size="12">0</text>
  <text x="771" y="22" class="t-muted t-mono" font-size="12" text-anchor="end">148 SMs</text>

  <!-- row 1: t = 0 -->
  <text x="0" y="52" class="t-ink" font-size="13" font-weight="600">t ≈ 0</text>
  <text x="0" y="68" class="t-muted" font-size="11.5">B just started</text>
  <rect x="120" y="38" width="422.4" height="30" rx="3" class="s-chk"/>
  <text x="331" y="58" class="t-chk" font-size="12.5" text-anchor="middle">B: 96 blocks (one per SM)</text>
  <rect x="542.4" y="38" width="228.8" height="30" rx="3" class="s-box"/>
  <text x="656.8" y="58" class="t-muted" font-size="12.5" text-anchor="middle">52 free</text>
  <text x="120" y="86" class="t-muted" font-size="12">A needs 144 SMs at once → 52 &lt; 144. Cooperative A cannot start; an ordinary A could start on the 52.</text>

  <!-- row 2: 4 stragglers -->
  <text x="0" y="132" class="t-ink" font-size="13" font-weight="600">t ≈ 3.1 ms</text>
  <text x="0" y="148" class="t-muted" font-size="11.5">4 stragglers left</text>
  <rect x="120" y="118" width="17.6" height="30" rx="3" class="s-chk"/>
  <rect x="137.6" y="118" width="633.6" height="30" rx="3" class="s-ok"/>
  <text x="454" y="138" class="t-ok" font-size="12.5" text-anchor="middle">144 free → A admitted (all 144 blocks within 0.6 µs)</text>
  <text x="120" y="166" class="t-muted" font-size="12">148 − 4 = 144 ≥ 144. The grid fits exactly; the four straggler SMs are the only ones A avoids.</text>

  <!-- row 3: 5 stragglers -->
  <text x="0" y="212" class="t-ink" font-size="13" font-weight="600">t ≈ 3.1 ms</text>
  <text x="0" y="228" class="t-muted" font-size="11.5">5 stragglers left</text>
  <rect x="120" y="198" width="22" height="30" rx="3" class="s-chk"/>
  <rect x="142" y="198" width="629.2" height="30" rx="3" class="s-box"/>
  <text x="456" y="218" class="t-muted" font-size="12.5" text-anchor="middle">143 free → still waiting</text>
  <text x="120" y="246" class="t-muted" font-size="12">148 − 5 = 143 &lt; 144. A waits for the fifth straggler, which ends at ≈ 4.6 ms; A starts then.</text>

  <!-- legend -->
  <rect x="120" y="270" width="14" height="11" rx="2" class="s-chk"/><text x="140" y="280" class="t-muted" font-size="12">busy with a B block</text>
  <rect x="290" y="270" width="14" height="11" rx="2" class="s-box"/><text x="310" y="280" class="t-muted" font-size="12">free, but not enough for A</text>
  <rect x="490" y="270" width="14" height="11" rx="2" class="s-ok"/><text x="510" y="280" class="t-muted" font-size="12">free, and enough for all of A</text>
</svg>
