<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 206" role="img" aria-label="Median gap between kernels: eager, eager with PDL, graph, graph with PDL">
  <!-- x: 0..1280 ns mapped to 230..710 (0.375 px per ns); gridlines every 256 ns -->
  <text x="230" y="16" font-size="11.5" class="t-muted">median gap between consecutive kernels (ns), N = 1,000, 50 µs kernels; gridlines every 256 ns</text>
  <line class="s-line" x1="230" x2="230" y1="26" y2="172" stroke-width="0.7"/>
  <line class="s-line" x1="326" x2="326" y1="26" y2="172" stroke-width="0.7" stroke-dasharray="2 3"/>
  <line class="s-line" x1="422" x2="422" y1="26" y2="172" stroke-width="0.7" stroke-dasharray="2 3"/>
  <line class="s-line" x1="518" x2="518" y1="26" y2="172" stroke-width="0.7" stroke-dasharray="2 3"/>
  <line class="s-line" x1="614" x2="614" y1="26" y2="172" stroke-width="0.7" stroke-dasharray="2 3"/>
  <line class="s-line" x1="710" x2="710" y1="26" y2="172" stroke-width="0.7" stroke-dasharray="2 3"/>
  <text x="230" y="188" font-size="10.5" text-anchor="middle" class="t-muted">0</text>
  <text x="326" y="188" font-size="10.5" text-anchor="middle" class="t-muted">256</text>
  <text x="422" y="188" font-size="10.5" text-anchor="middle" class="t-muted">512</text>
  <text x="518" y="188" font-size="10.5" text-anchor="middle" class="t-muted">768</text>
  <text x="614" y="188" font-size="10.5" text-anchor="middle" class="t-muted">1,024</text>
  <text x="710" y="188" font-size="10.5" text-anchor="middle" class="t-muted">1,280</text>
  <text x="220" y="49" font-size="12" text-anchor="end" font-weight="600" class="t-ink">eager</text>
  <rect class="s-acc" x="230" y="34" width="384" height="22" rx="3"/>
  <text x="620" y="50" font-size="11.5" class="t-acc t-mono">1,024</text>
  <text x="220" y="85" font-size="12" text-anchor="end" font-weight="600" class="t-ink">eager + PDL</text>
  <rect class="s-acc" x="230" y="70" width="288" height="22" rx="3" fill-opacity="0.5"/>
  <text x="524" y="86" font-size="11.5" class="t-acc t-mono">768</text>
  <text x="220" y="121" font-size="12" text-anchor="end" font-weight="600" class="t-ink">graph</text>
  <rect class="s-ok" x="230" y="106" width="288" height="22" rx="3"/>
  <text x="524" y="122" font-size="11.5" class="t-ok t-mono">768</text>
  <text x="220" y="157" font-size="12" text-anchor="end" font-weight="600" class="t-ink">graph + PDL</text>
  <rect class="s-ok" x="230" y="142" width="192" height="22" rx="3" fill-opacity="0.5"/>
  <text x="428" y="158" font-size="11.5" class="t-ok t-mono">512</text>
  <text x="380" y="203" font-size="10.5" text-anchor="middle" class="t-muted">Each tool removes one 256 ns step, and the two stack: graph + PDL is half of plain eager.</text>
</svg>
