  <text x="58" y="436" font-size="11" class="t-ink">Every launch, eager or graph: the driver writes into the command buffer; the front end reads it over PCIe.</text>
  <circle class="s-acc" cx="18" cy="456" r="9"/>
  <text x="18" y="460" font-size="10.5" font-weight="700" text-anchor="middle" class="t-ink">3</text>
  <text x="58" y="460" font-size="11" class="t-ink">Graph only: upload's arguments end up in GPU memory, and replays read them there (inferred).</text>
  <text x="14" y="484" font-size="11" class="t-muted">Numbers in parentheses are the stop that measures each piece.</text>
</svg>
