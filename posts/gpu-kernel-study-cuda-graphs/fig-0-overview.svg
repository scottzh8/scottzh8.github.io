<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" role="img" aria-label="System map: host with user space, the kernel driver's device files and the host-RAM command buffer; PCIe; GPU with hardware front end, 148 SMs in 8 GPCs, the gap between kernels, and HBM holding the graph's data">
  <defs>
    <marker id="ov-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker>
    <marker id="ov-arrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="t-chk"/></marker>
    <marker id="ov-arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead-acc"/></marker>
    <marker id="ov-arras" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" class="arrowhead-acc"/></marker>
  </defs>
  <text x="14" y="20" font-size="14" font-weight="700" class="t-ink">Host</text>
  <text x="58" y="20" font-size="11.5" class="t-muted">CPU + host RAM</text>
  <rect class="s-box" x="10" y="30" width="340" height="380" rx="12"/>
  <text x="24" y="52" font-size="10.5" class="t-muted">user space</text>
  <rect class="s-box" x="24" y="60" width="124" height="58" rx="8"/>
  <text x="86" y="82" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">your program</text>
  <text x="86" y="98" font-size="10" text-anchor="middle" class="t-mono t-muted">kernel&lt;&lt;&lt;…&gt;&gt;&gt;</text>
  <text x="86" y="111" font-size="10" text-anchor="middle" class="t-mono t-muted">cudaGraphLaunch</text>
  <rect class="s-box" x="168" y="60" width="170" height="58" rx="8"/>
  <text x="253" y="80" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">CUDA runtime +</text>
  <text x="253" y="95" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">user-mode driver</text>
  <text x="253" y="110" font-size="10.5" text-anchor="middle" class="t-muted">~1.5 µs per eager launch (3)</text>
  <path class="s-line" fill="none" d="M148,89 H164" marker-end="url(#ov-arr)"/>
  <line class="s-line" x1="18" x2="342" y1="134" y2="134" stroke-dasharray="3 4"/>
  <text x="24" y="150" font-size="10.5" class="t-muted">kernel space</text>
  <rect class="s-box" x="24" y="158" width="250" height="62" rx="8"/>
  <text x="149" y="177" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">NVIDIA kernel driver</text>
  <text x="36" y="195" font-size="9.5" class="t-mono t-muted">/dev/nvidiactl → host-RAM mappings</text>
  <text x="36" y="210" font-size="9.5" class="t-mono t-muted">/dev/nvidiaN → window onto GPU memory</text>
  <text x="24" y="242" font-size="10.5" class="t-muted">host RAM</text>
  <rect class="s-box" x="24" y="250" width="314" height="146" rx="8"/>
  <rect class="s-chk" x="36" y="260" width="290" height="104" rx="8"/>
  <text x="181" y="278" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">command buffer</text>
  <text x="181" y="292" font-size="10" text-anchor="middle" class="t-muted">a /dev/nvidiactl mapping, write-combined (4)</text>
  <text x="48" y="312" font-size="10.5" font-weight="600" class="t-ink">eager launch:</text>
  <text x="140" y="312" font-size="10.5" class="t-ink">commands + args, ~2.4 KB</text>
  <text x="48" y="330" font-size="10.5" font-weight="600" class="t-ink">graph upload:</text>
  <text x="140" y="330" font-size="10.5" class="t-ink">args pass through once</text>
  <text x="48" y="348" font-size="10.5" font-weight="600" class="t-ink">graph replay:</text>
  <text x="140" y="348" font-size="10.5" class="t-ink">no new copies of the args</text>
  <text x="36" y="384" font-size="10.5" class="t-muted">also: pinned buffers, page tables, …</text>
  <rect class="s-chip" x="362" y="30" width="46" height="380" rx="10"/>
  <text x="385" y="372" font-size="13" font-weight="700" text-anchor="middle" class="t-ink" transform="rotate(-90 385 372)">PCIe</text>
  <text x="424" y="20" font-size="14" font-weight="700" class="t-ink">GPU</text>
  <text x="458" y="20" font-size="11.5" class="t-muted">NVIDIA B200</text>
  <rect class="s-box" x="420" y="30" width="330" height="380" rx="12"/>
  <rect class="s-box" x="434" y="44" width="290" height="40" rx="8"/>
  <text x="579" y="62" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">hardware front end</text>
  <text x="579" y="77" font-size="10.5" text-anchor="middle" class="t-muted">reads commands, starts kernels</text>
