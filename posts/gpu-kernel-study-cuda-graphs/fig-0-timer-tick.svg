<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" role="img" aria-label="Illustration: the timer steps every 32 ns; the timing loop reads it less often than that, so every read sees a new value and the jumps are 32 or 64 ns">
  <defs><marker id="cg0-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker></defs>
  <rect class="s-box" x="8" y="8" width="364" height="212" rx="10"/>
  <text x="22" y="32" font-size="13.5" font-weight="700" class="t-ink">Hypothetical: a loop faster than the tick</text>
  <text x="22" y="50" font-size="11.5" class="t-muted">it would read each value several times</text>
  <path class="s-line" fill="none" d="M32,168 H80 V154 H128 V140 H176 V126 H224 V112 H272 V98 H320 V84 H368"/>
  <text x="32" y="76" font-size="10.5" class="t-muted">timer value</text>
  <line class="s-line" x1="282" x2="362" y1="186" y2="186" marker-end="url(#cg0-arr)"/>
  <text x="282" y="182" font-size="10.5" class="t-muted">time</text>
  <circle class="s-chk" cx="38" cy="168" r="4"/>
  <circle class="s-chk" cx="54" cy="168" r="4"/>
  <circle class="s-chk" cx="70" cy="168" r="4"/>
  <circle class="s-chk" cx="86" cy="154" r="4"/>
  <circle class="s-chk" cx="102" cy="154" r="4"/>
  <circle class="s-chk" cx="118" cy="154" r="4"/>
  <circle class="s-chk" cx="134" cy="140" r="4"/>
  <circle class="s-chk" cx="150" cy="140" r="4"/>
  <circle class="s-chk" cx="166" cy="140" r="4"/>
  <circle class="s-chk" cx="182" cy="126" r="4"/>
  <circle class="s-chk" cx="198" cy="126" r="4"/>
  <circle class="s-chk" cx="214" cy="126" r="4"/>
  <circle class="s-chk" cx="230" cy="112" r="4"/>
  <circle class="s-chk" cx="246" cy="112" r="4"/>
  <circle class="s-chk" cx="262" cy="112" r="4"/>
  <circle class="s-chk" cx="278" cy="98" r="4"/>
  <circle class="s-chk" cx="294" cy="98" r="4"/>
  <circle class="s-chk" cx="310" cy="98" r="4"/>
  <circle class="s-chk" cx="326" cy="84" r="4"/>
  <circle class="s-chk" cx="342" cy="84" r="4"/>
  <circle class="s-chk" cx="358" cy="84" r="4"/>
  <path class="s-line" fill="none" d="M32,180 v-4 M32,178 H80 M80,180 v-4"/>
  <text x="56.0" y="192" font-size="10.5" text-anchor="middle" class="t-muted">32 ns</text>
  <text x="22" y="210" font-size="11.5" class="t-ink">read count would be 3 (did not happen)</text>
  <rect class="s-box" x="388" y="8" width="364" height="212" rx="10"/>
  <text x="402" y="32" font-size="13.5" font-weight="700" class="t-ink">What the loop actually saw</text>
  <text x="402" y="50" font-size="11.5" class="t-muted">every read already shows a new value</text>
  <path class="s-line" fill="none" d="M412,168 H460 V154 H508 V140 H556 V126 H604 V112 H652 V98 H700 V84 H748"/>
  <text x="412" y="76" font-size="10.5" class="t-muted">timer value</text>
  <line class="s-line" x1="662" x2="742" y1="186" y2="186" marker-end="url(#cg0-arr)"/>
  <text x="662" y="182" font-size="10.5" class="t-muted">time</text>
  <circle class="s-acc" cx="422" cy="168" r="4"/>
  <circle class="s-acc" cx="494" cy="154" r="4"/>
  <text x="494" y="145" font-size="11" font-weight="600" text-anchor="middle" class="t-acc">+32</text>
  <circle class="s-acc" cx="566" cy="126" r="4"/>
  <text x="566" y="117" font-size="11" font-weight="600" text-anchor="middle" class="t-acc">+64</text>
  <circle class="s-acc" cx="638" cy="112" r="4"/>
  <text x="638" y="103" font-size="11" font-weight="600" text-anchor="middle" class="t-acc">+32</text>
  <circle class="s-acc" cx="710" cy="84" r="4"/>
  <text x="710" y="75" font-size="11" font-weight="600" text-anchor="middle" class="t-acc">+64</text>
  <path class="s-line" fill="none" d="M412,180 v-4 M412,178 H460 M460,180 v-4"/>
  <text x="436.0" y="192" font-size="10.5" text-anchor="middle" class="t-muted">32 ns</text>
  <text x="402" y="210" font-size="11.5" class="t-ink">read count always 1; jumps of +32 or +64 ns</text>
</svg>
