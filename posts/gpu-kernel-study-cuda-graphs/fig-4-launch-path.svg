<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" role="img" aria-label="Where launch data lives: eager launches versus CUDA graph upload and replay">
  <defs>
    <marker id="cg4-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker>
    <marker id="cg4-arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead-acc"/></marker>
  </defs>
  <!-- ===== Eager ===== -->
  <text x="10" y="20" font-size="13.5" font-weight="700" class="t-ink">Eager: every launch</text>
  <rect class="s-box" x="10" y="36" width="140" height="64" rx="8"/>
  <text x="80" y="60" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">CPU thread</text>
  <text x="80" y="77" font-size="10.5" text-anchor="middle" class="t-mono t-muted">kernel&lt;&lt;&lt;…&gt;&gt;&gt;</text>
  <text x="80" y="92" font-size="10.5" text-anchor="middle" class="t-muted">~1.5 µs per call</text>
  <rect class="s-chk" x="200" y="36" width="230" height="64" rx="8"/>
  <text x="315" y="56" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">command buffer in host RAM</text>
  <text x="315" y="72" font-size="10.5" text-anchor="middle" class="t-muted">write-combined, a /dev/nvidiactl mapping</text>
  <text x="315" y="89" font-size="10.5" text-anchor="middle" class="t-ink">commands + args inline, ~2.4 KB per launch</text>
  <rect class="s-box" x="490" y="36" width="120" height="64" rx="8"/>
  <text x="550" y="64" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">GPU front end</text>
  <text x="550" y="81" font-size="10.5" text-anchor="middle" class="t-muted">reads commands</text>
  <rect class="s-box" x="660" y="36" width="90" height="64" rx="8"/>
  <text x="705" y="72" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">148 SMs</text>
  <line class="s-line" x1="150" x2="196" y1="68" y2="68" marker-end="url(#cg4-arr)"/>
  <text x="173" y="62" font-size="10" text-anchor="middle" class="t-muted">writes</text>
  <line class="s-line" x1="430" x2="486" y1="68" y2="68" marker-end="url(#cg4-arr)"/>
  <text x="458" y="62" font-size="10" text-anchor="middle" class="t-muted">PCIe</text>
  <line class="s-line" x1="610" x2="656" y1="68" y2="68" marker-end="url(#cg4-arr)"/>
  <text x="315" y="118" font-size="10.5" text-anchor="middle" class="t-chk">measured: marker args found here, 2,432 B apart</text>
  <text x="550" y="118" font-size="10.5" text-anchor="middle" class="t-muted">read ahead, not in the gap</text>
  <line class="s-line" x1="10" x2="750" y1="140" y2="140" stroke-dasharray="3 4"/>
  <!-- ===== Graph ===== -->
  <text x="10" y="166" font-size="13.5" font-weight="700" class="t-ink">CUDA graph</text>
  <text x="10" y="186" font-size="11" class="t-muted">once, at instantiate + upload</text>
  <rect class="s-box" x="10" y="196" width="140" height="56" rx="8"/>
  <text x="80" y="220" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">CPU thread</text>
  <text x="80" y="238" font-size="10.5" text-anchor="middle" class="t-mono t-muted">cudaGraphUpload</text>
  <rect class="s-chk" x="200" y="196" width="230" height="56" rx="8"/>
  <text x="315" y="218" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">same host command buffer</text>
  <text x="315" y="236" font-size="10.5" text-anchor="middle" class="t-ink">args pass through once</text>
  <rect class="s-acc" x="490" y="196" width="260" height="56" rx="8"/>
  <text x="620" y="218" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">GPU memory: the graph's own data</text>
  <text x="620" y="236" font-size="10.5" text-anchor="middle" class="t-ink">launch data + frozen args (taken at instantiate)</text>
  <line class="s-line" x1="150" x2="196" y1="224" y2="224" marker-end="url(#cg4-arr)"/>
  <line class="s-acc-line" x1="430" x2="486" y1="224" y2="224" marker-end="url(#cg4-arra)"/>
  <text x="10" y="284" font-size="11" class="t-muted">every replay</text>
  <rect class="s-box" x="10" y="294" width="140" height="56" rx="8"/>
  <text x="80" y="318" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">CPU thread</text>
  <text x="80" y="336" font-size="10.5" text-anchor="middle" class="t-mono t-muted">cudaGraphLaunch</text>
  <rect class="s-box" x="490" y="294" width="120" height="56" rx="8"/>
  <text x="550" y="326" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">GPU front end</text>
  <rect class="s-box" x="660" y="294" width="90" height="56" rx="8"/>
  <text x="705" y="326" font-size="12" font-weight="600" text-anchor="middle" class="t-ink">148 SMs</text>
  <line class="s-line" x1="150" x2="486" y1="322" y2="322" marker-end="url(#cg4-arr)"/>
  <text x="318" y="316" font-size="10.5" text-anchor="middle" class="t-muted">one call for the whole chain; no new arg copies written</text>
  <line class="s-line" x1="610" x2="656" y1="322" y2="322" marker-end="url(#cg4-arr)"/>
  <line class="s-acc-line" x1="550" x2="550" y1="254" y2="290" marker-end="url(#cg4-arra)" stroke-dasharray="5 3"/>
  <text x="560" y="276" font-size="10.5" class="t-acc">reads graph data (inferred)</text>
  <text x="380" y="368" font-size="10.5" text-anchor="middle" class="t-muted">After 100,000 other launches overwrote the host buffer, the replay still used the right arguments.</text>
</svg>
