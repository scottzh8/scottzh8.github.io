<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" role="img" aria-label="Normal cached host RAM versus write-combined host RAM: how CPU writes, CPU reads and GPU reads behave">
  <defs>
    <marker id="wc-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="t-chk"/></marker>
    <marker id="wc-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead-acc"/></marker>
    <marker id="wc-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker>
  </defs>
  <rect class="s-box" x="8" y="8" width="364" height="290" rx="10"/>
  <text x="22" y="30" font-size="13.5" font-weight="700" class="t-ink">Normal (cached) host RAM</text>
  <text x="22" y="47" font-size="10.5" class="t-muted">ordinary malloc / pinned memory</text>
  <rect class="s-box" x="52" y="62" width="110" height="36" rx="6"/>
  <text x="107.0" y="84.0" font-size="11.5" font-weight="600" text-anchor="middle" class="t-ink">CPU core</text>
  <rect class="s-box" x="52" y="134" width="110" height="36" rx="6"/>
  <text x="107.0" y="156.0" font-size="11.5" font-weight="600" text-anchor="middle" class="t-ink">CPU cache</text>
  <rect class="s-box" x="52" y="206" width="180" height="36" rx="6"/>
  <text x="142.0" y="228.0" font-size="11.5" font-weight="600" text-anchor="middle" class="t-ink">host RAM</text>
  <rect class="s-acc" x="274" y="206" width="84" height="36" rx="6"/>
  <text x="316.0" y="228.0" font-size="11.5" font-weight="600" text-anchor="middle" class="t-ink">GPU</text>
  <line class="s-line" x1="232" x2="274" y1="224" y2="224"/>
  <text x="253.0" y="218" font-size="9.5" text-anchor="middle" class="t-muted">PCIe</text>
  <path class="s-chk" fill="none" style="fill:none;stroke-width:2" d="M86,98 V130" marker-end="url(#wc-w)"/>
  <path class="s-acc-line" fill="none" d="M128,134 V102" marker-end="url(#wc-r)"/>
  <path class="s-line" fill="none" d="M107,170 V202" marker-end="url(#wc-n)" stroke-dasharray="4 3"/>
  <text x="174" y="76" font-size="11" font-weight="600" class="t-chk">write: lands in the cache</text>
  <text x="174" y="92" font-size="11" font-weight="600" class="t-acc">read: cache hit, 0.27 ns</text>
  <text x="114" y="192" font-size="10.5" class="t-muted">copied to RAM later</text>
  <path class="s-acc-line" fill="none" d="M316,242 V256 H142 V246" marker-end="url(#wc-r)"/>
  <path class="s-line" fill="none" d="M338,206 V146 H166" stroke-dasharray="4 3" marker-end="url(#wc-n)"/>
  <text x="332" y="180" font-size="10" text-anchor="end" class="t-muted">snoop</text>
  <text x="22" y="276" font-size="10.5" class="t-ink">GPU read: the newest copy may still be in the</text>
  <text x="22" y="290" font-size="10.5" class="t-ink">CPU cache, so the read has to check there.</text>
  <rect class="s-box" x="388" y="8" width="364" height="290" rx="10"/>
  <text x="402" y="30" font-size="13.5" font-weight="700" class="t-ink">Write-combined host RAM</text>
  <text x="402" y="47" font-size="10.5" class="t-muted">the eager command buffer</text>
  <rect class="s-box" x="432" y="62" width="110" height="36" rx="6"/>
  <text x="487.0" y="84.0" font-size="11.5" font-weight="600" text-anchor="middle" class="t-ink">CPU core</text>
  <rect class="s-chk" x="432" y="134" width="110" height="36" rx="6"/>
  <text x="487.0" y="150.0" font-size="11.5" font-weight="600" text-anchor="middle" class="t-ink">WC buffer</text>
  <text x="487.0" y="164.0" font-size="10" text-anchor="middle" class="t-muted">64 B, write-only</text>
  <rect class="s-box" x="432" y="206" width="180" height="36" rx="6"/>
  <text x="522.0" y="228.0" font-size="11.5" font-weight="600" text-anchor="middle" class="t-ink">host RAM</text>
  <rect class="s-acc" x="654" y="206" width="84" height="36" rx="6"/>
  <text x="696.0" y="228.0" font-size="11.5" font-weight="600" text-anchor="middle" class="t-ink">GPU</text>
  <line class="s-line" x1="612" x2="654" y1="224" y2="224"/>
  <text x="633.0" y="218" font-size="9.5" text-anchor="middle" class="t-muted">PCIe</text>
  <path class="s-chk" fill="none" style="fill:none;stroke-width:2" d="M487,98 V130" marker-end="url(#wc-w)"/>
  <path class="s-chk" fill="none" style="fill:none;stroke-width:2" d="M487,170 V202" marker-end="url(#wc-w)"/>
  <path class="s-acc-line" fill="none" d="M414,206 V80 H428" marker-end="url(#wc-r)"/>
  <text x="554" y="76" font-size="11" font-weight="600" class="t-acc">read: skips every cache</text>
  <text x="554" y="92" font-size="11" font-weight="600" class="t-acc">~121 ns per load</text>
  <text x="554" y="150" font-size="11" font-weight="600" class="t-chk">writes gathered into</text>
  <text x="554" y="164" font-size="11" font-weight="600" class="t-chk">64 B bursts, sent to RAM</text>
  <path class="s-acc-line" fill="none" d="M696,242 V256 H522 V246" marker-end="url(#wc-r)"/>
  <text x="402" y="276" font-size="10.5" class="t-ink">GPU read: the data is already in RAM;</text>
  <text x="402" y="290" font-size="10.5" class="t-ink">nothing in the CPU cache to check.</text>
  <text x="14" y="322" font-size="11" font-weight="600" class="t-chk">Orange: CPU writes.</text>
  <text x="136" y="322" font-size="11" font-weight="600" class="t-acc">Blue: reads.</text>
  <text x="212" y="322" font-size="11" class="t-muted">Read costs measured in this study; the snoop and burst behaviour is general background.</text>
</svg>
