<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 200" role="img" aria-label="Release pattern: large pretraining, base model, RSI post-training loop, new checkpoint, distillation and quantization to Flash models">
<defs>
<marker id="fig-5-release-loop-ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker>
</defs>
<rect x="10" y="60" width="130" height="70" rx="8" class="s-chk"/>
<text x="75" y="88" text-anchor="middle" class="t-chk" font-size="13" font-weight="600">Big pretrain</text>
<text x="75" y="106" text-anchor="middle" class="t-chk" font-size="11">months · TPU 8t</text>
<rect x="175" y="60" width="130" height="70" rx="8" class="s-acc"/>
<text x="240" y="88" text-anchor="middle" class="t-acc" font-size="13" font-weight="600">Base frontier</text>
<text x="240" y="106" text-anchor="middle" class="t-acc" font-size="11">Gemini 4 Argon</text>
<rect x="340" y="60" width="140" height="70" rx="8" class="s-box"/>
<text x="410" y="88" text-anchor="middle" class="t-ink" font-size="13" font-weight="600">RSI post-training</text>
<text x="410" y="106" text-anchor="middle" class="t-muted" font-size="11">agents improve agents</text>
<path d="M370,60 C370,22 450,22 450,60" class="s-acc-line" marker-end="url(#fig-5-release-loop-ah3)"/>
<text x="410" y="20" text-anchor="middle" class="t-acc" font-size="11">weeks per loop</text>
<rect x="515" y="20" width="110" height="56" rx="8" class="s-acc"/>
<text x="570" y="44" text-anchor="middle" class="t-acc" font-size="12" font-weight="600">New checkpoint</text>
<text x="570" y="61" text-anchor="middle" class="t-acc" font-size="11">“Carbon”</text>
<rect x="515" y="112" width="110" height="56" rx="8" class="s-ok"/>
<text x="570" y="136" text-anchor="middle" class="t-ok" font-size="12" font-weight="600">Distill + quantize</text>
<text x="570" y="153" text-anchor="middle" class="t-ok" font-size="11">→ Flash / Lite</text>
<rect x="650" y="112" width="80" height="56" rx="8" class="s-box"/>
<text x="690" y="136" text-anchor="middle" class="t-ink" font-size="11" font-weight="600">Serve at scale</text>
<text x="690" y="152" text-anchor="middle" class="t-ink" font-size="11">TPU 8i</text>
<line x1="142" y1="95" x2="171" y2="95" class="s-line" marker-end="url(#fig-5-release-loop-ah3)"/>
<line x1="307" y1="95" x2="336" y2="95" class="s-line" marker-end="url(#fig-5-release-loop-ah3)"/>
<line x1="482" y1="82" x2="511" y2="56" class="s-line" marker-end="url(#fig-5-release-loop-ah3)"/>
<line x1="482" y1="108" x2="511" y2="134" class="s-line" marker-end="url(#fig-5-release-loop-ah3)"/>
<line x1="627" y1="140" x2="646" y2="140" class="s-line" marker-end="url(#fig-5-release-loop-ah3)"/>
<text x="370" y="192" text-anchor="middle" class="t-muted" font-size="11">One expensive pretraining run produces many cheap releases.</text>
</svg>
