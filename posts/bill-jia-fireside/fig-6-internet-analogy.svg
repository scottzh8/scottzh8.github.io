<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 210" role="img" aria-label="Internet timeline 1995 to 2026 aligned with AI timeline 2020 to 2026, mapping AI today to internet 1997">
<text x="20" y="54" class="t-ink" font-size="12" font-weight="600">Internet</text>
<line x1="100" y1="50" x2="720" y2="50" class="s-line"/>
<!-- scale: 1995→100, 2026→720 ; 20px/yr -->
<circle cx="100" cy="50" r="5" class="s-box"/><text x="100" y="32" text-anchor="middle" class="t-muted t-mono" font-size="10">1995</text><text x="100" y="72" text-anchor="middle" class="t-muted" font-size="10">dial-up</text>
<circle cx="140" cy="50" r="7" class="s-chk"/><text x="140" y="32" text-anchor="middle" class="t-chk t-mono" font-size="10" font-weight="600">1997</text>
<circle cx="200" cy="50" r="5" class="s-box"/><text x="200" y="32" text-anchor="middle" class="t-muted t-mono" font-size="10">2000</text><text x="200" y="72" text-anchor="middle" class="t-muted" font-size="10">DSL</text>
<circle cx="340" cy="50" r="5" class="s-box"/><text x="340" y="32" text-anchor="middle" class="t-muted t-mono" font-size="10">2007</text><text x="340" y="72" text-anchor="middle" class="t-muted" font-size="10">smartphone</text>
<circle cx="500" cy="50" r="5" class="s-box"/><text x="500" y="32" text-anchor="middle" class="t-muted t-mono" font-size="10">2015</text><text x="500" y="72" text-anchor="middle" class="t-muted" font-size="10">mobile-first</text>
<circle cx="720" cy="50" r="5" class="s-box"/><text x="720" y="32" text-anchor="middle" class="t-muted t-mono" font-size="10">2026</text><text x="712" y="72" text-anchor="end" class="t-muted" font-size="10">Wi-Fi is a given</text>
<rect x="150" y="84" width="570" height="20" rx="4" class="s-chip"/>
<text x="435" y="98" text-anchor="middle" class="t-muted" font-size="11">~29 years of build-out still ahead, if the analogy holds</text>
<text x="20" y="164" class="t-ink" font-size="12" font-weight="600">AI</text>
<line x1="100" y1="160" x2="220" y2="160" class="s-acc-line"/>
<circle cx="100" cy="160" r="5" class="s-acc"/><text x="100" y="186" text-anchor="middle" class="t-acc t-mono" font-size="10">2020</text><text x="100" y="200" text-anchor="middle" class="t-muted" font-size="10">GPT-3</text>
<circle cx="140" cy="160" r="5" class="s-acc"/><text x="140" y="142" text-anchor="middle" class="t-acc t-mono" font-size="10">2022</text><text x="150" y="128" text-anchor="middle" class="t-muted" font-size="10">ChatGPT</text>
<circle cx="220" cy="160" r="7" class="s-chk"/><text x="220" y="186" text-anchor="middle" class="t-chk t-mono" font-size="10" font-weight="600">2026</text><text x="220" y="200" text-anchor="middle" class="t-muted" font-size="10">today</text>
<path d="M220,153 C210,110 150,100 140,58" class="s-line" stroke-dasharray="4 3"/>
<text x="250" y="150" class="t-chk" font-size="11" font-weight="600">AI 2026 ≈ Internet 1997 (Bill's analogy)</text>
</svg>
